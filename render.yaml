# Render Blueprint: the PagePatch API (Node web service) + Postgres.
# Secrets are set in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: pagepatch-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pagepatch/api build
    startCommand: node api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pagepatch-db
          property: connectionString
      - key: ALLOWED_EXTENSION_IDS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: pagepatch-db
    plan: basic-256mb
    region: oregon
    databaseName: pagepatch
    ipAllowList: []
