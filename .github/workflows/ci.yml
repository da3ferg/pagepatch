name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pp
          POSTGRES_DB: pagepatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:pp@localhost:5432/pagepatch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @pagepatch/shared test
      - run: pnpm --filter @pagepatch/api test
      - run: pnpm --filter @pagepatch/fixture-react build
      - run: pnpm --filter @pagepatch/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @pagepatch/extension test
      - run: pnpm --filter @pagepatch/api build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches manifest version
        run: test "v$(node -p 'require("./extension/manifest.json").version')" = "$GITHUB_REF_NAME"
      - name: Build extension ZIP
        run: pnpm --filter @pagepatch/extension zip
        env:
          PAGEPATCH_API: ${{ vars.PAGEPATCH_API }}
          GH_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
          GH_APP_SLUG: ${{ vars.GH_APP_SLUG }}
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "PagePatch $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
